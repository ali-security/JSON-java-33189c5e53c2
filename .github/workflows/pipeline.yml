# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven test selector (e.g. -Dtest=JSONObjectTest); empty runs the full suite'
        required: false
        default: ''

jobs:
  # old-school build and jar method. No tests run or compiled.
  build-1_6: 
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # build for java 1.6, however don't run any tests
        java: [ 1.6 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      # Azul's discovery API no longer lists JDK 6, so setup-java@v1 cannot resolve
      # it by version; fetch the Zulu 6 tarball from Azul's CDN and hand it over.
      - name: Download Zulu JDK ${{ matrix.java }}
        run: curl -fsSL -o "$RUNNER_TEMP/zulu6.tar.gz" https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
          jdkFile: ${{ runner.temp }}/zulu6.tar.gz
      - name: Compile Java ${{ matrix.java }}
        run: |
          mkdir -p target/classes
          javac -d target/classes/ src/main/java/org/json/*.java
      - name: Create java ${{ matrix.java }} JAR
        run: |
          jar cvf target/org.json.jar -C target/classes .
      - name: Upload Java ${{ matrix.java }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: Java ${{ matrix.java }} JAR
          path: target/org.json.jar
      
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # maven-compiler-plugin 2.3.2 runs javac in-process; the deeply chained test
    # sources intermittently overflow javac's default 1 MB thread stack on JDK 11.
    env:
      MAVEN_OPTS: -Xss4m
    strategy:
      matrix:
        # build against supported Java LTS versions:
        java: [ 8, 11 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: Compile Java ${{ matrix.java }}
        run: mvn clean compile -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dmaven.test.skip=true -Dmaven.site.skip=true -Dmaven.javadoc.skip=true
      - name: Run Tests ${{ matrix.java }}
        run: |
          mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} ${{ inputs.test-filter }}
      - name: Package release JAR ${{ matrix.java }}
        if: ${{ matrix.java == 8 }}
        run: |
          mvn package -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} ${{ inputs.test-filter }}
      - name: Upload release JAR ${{ matrix.java }}
        if: ${{ matrix.java == 8 }}
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          if-no-files-found: error
          path: |
            target/json-*.jar
            !target/json-*-sources.jar
            !target/json-*-javadoc.jar
      - name: Build Test Report ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          mvn surefire-report:report-only -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
          mvn site -DgenerateReports=false -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
      - name: Upload Test Results ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results ${{ matrix.java }}
          path: target/surefire-reports/
      - name: Upload Test Report ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Report ${{ matrix.java }}
          path: target/site/
